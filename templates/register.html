{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
    <h2>📝 Create Account</h2>

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ username or '' }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <small style="color: #666; font-size: 0.8rem;">Minimum 6 characters</small>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-success" style="width: 100%;">Register</button>
    </form>

    <p class="text-center mt-20">
        Already have an account? <a href="{{ url_for('login') }}" style="color: #667eea; font-weight: 600;">Login here</a>
    </p>
{% endblock %}
