{% extends "base.html" %}

{% block title %}Create Post{% endblock %}

{% block content %}
    <h2>✏️ Create New Post</h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label for="title">Title:</label><br>
            <input type="text" id="title" name="title" placeholder="Enter post title..." required>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="content">Content:</label><br>
            <textarea id="content" name="content" placeholder="Write your post content here..." required></textarea>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-success">Publish Post</button>
            <a href="{{ url_for('index') }}" class="btn btn-primary">Cancel</a>
        </div>
    </form>
{% endblock %}
