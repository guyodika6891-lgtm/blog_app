{% extends "base.html" %}

{% block title %}Create Post{% endblock %}

{% block content %}
    <h2>✏️ Create New Post</h2>

    <form method="POST">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Enter post title..." required>
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" placeholder="Write your post content here..." required></textarea>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button type="submit" class="btn btn-success" style="flex: 1;">Publish Post</button>
            <a href="{{ url_for('index') }}" class="btn btn-primary" style="flex: 1;">Cancel</a>
        </div>
    </form>
{% endblock %}
